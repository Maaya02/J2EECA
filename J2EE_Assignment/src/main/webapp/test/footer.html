<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .footerDiv {
            display: flex;
            background-color: #D9D9D9;
            justify-content: center;
            padding: 3%;
            flex-direction: column;
        }

        .footerDiv>div {
            margin-bottom: 2.5%;
            display: flex;
            justify-content: center;
        }

        .footerAnchorTag {
            color: black;
            text-decoration: none;
            font-size: 23px;
            font-weight: 500;
        }

        #backToTop {
            text-decoration: none;
            color: black;
            border: none;
            background: transparent;

        }

        #backToTop:focus {
            outline: none;
        }

        #arrowUpSymbol {
            rotate: 180deg;
        }
    </style>
</head>

<body>
    <div class="footerDiv">
        <div>
            <img src="./image_2.png" alt="pictureOfLogo" />

        </div>
        <div>
            <h1>Silver Care</h1>

        </div>
        <div style="gap: 6%;">
            <a href="" class="footerAnchorTag">Home</a>
            <a href="" class="footerAnchorTag">Contact Us</a>
            <a href="" class="footerAnchorTag">Services</a>
        </div>
        <div style="justify-content: flex-end;">
            <button id="backToTop" onclick="scrollToTop()">Back to top <img src="./arrow.down.app.png" alt="arrowUp"
                    id="arrowUpSymbol"></button>
        </div>

    </div>
    <script>
        function scrollToTop() {
            document.body.scrollTop = 0; // For Safari
            document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
